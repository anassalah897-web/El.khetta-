services:
  - type: web
    name: yalla-nkhattat
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yalla-plans-db
          property: connectionString

databases:
  - name: yalla-plans-db
    databaseName: yalla_nkhattat
    region: frankfurt
    plan: free
    ipAllowList: []
